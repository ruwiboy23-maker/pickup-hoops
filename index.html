<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1420" media="(prefers-color-scheme: dark)">
<meta name="description" content="Courtside organizer for pickup basketball: fair rotation, winners, court share and prize money. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pickup Hoops">
<title>Pickup Hoops Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Base reset (the hosted version got this from its page skeleton). */
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one phone-width column, scoreboard first, three thumb-reach tabs fixed at the bottom. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#141B2D; --muted:#5B657A; --line:#D5DAE3;
  --a:#1F4FD8; --a-soft:#E3EAFC; --b:#C2410C; --b-soft:#FCE9DD; --on-team:#FFFFFF;
  --good:#157F3B; --good-soft:#DDF3E4; --warn:#B42318;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1420; --surface:#1A2130; --ink:#EEF1F7; --muted:#9AA5BA; --line:#2C3547;
  --a:#7FA2FF; --a-soft:#1C2A52; --b:#FF9A5C; --b-soft:#4A2713; --on-team:#0F1420;
  --good:#4FCB7C; --good-soft:#15361F; --warn:#FF8A7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1420; --surface:#1A2130; --ink:#EEF1F7; --muted:#9AA5BA; --line:#2C3547;
  --a:#7FA2FF; --a-soft:#1C2A52; --b:#FF9A5C; --b-soft:#4A2713; --on-team:#0F1420;
  --good:#4FCB7C; --good-soft:#15361F; --warn:#FF8A7A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}

.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px 10px}
.top h1{font-size:26px;text-transform:uppercase;white-space:nowrap}
.top .meta{text-align:right;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
#sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px}
#sync.off::before{background:var(--muted)}

main.wrap{display:flex;flex-direction:column;gap:14px;padding-block:4px calc(96px + env(safe-area-inset-bottom,0px))}
body.setup main.wrap{padding-block:4px 32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2{font-size:22px;text-transform:uppercase}
.sub{color:var(--muted);font-size:14px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.stats b{display:block;font-family:var(--display);font-size:22px;line-height:1.2;white-space:nowrap}
.stats .label{font-size:11px}

.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.team.ta{background:var(--a-soft)} .team.tb{background:var(--b-soft)}
.team h3{font-size:18px;text-transform:uppercase}
.ta h3,.ta .score{color:var(--a)} .tb h3,.tb .score{color:var(--b)}
.score{font-family:var(--display);font-size:64px;line-height:.9;font-weight:700}
.pts{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.pts button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;padding:0 8px}
.pts small{display:block;font-size:11px;font-weight:500;color:var(--muted);line-height:1}
.names{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-weight:500}
.names li{overflow-wrap:anywhere}
.names .pl{all:unset;box-sizing:border-box;display:block;width:100%;padding:3px 6px;margin-left:-6px;border-radius:8px;cursor:pointer;overflow-wrap:anywhere;font-weight:500}
.names .pl:focus-visible{outline:3px solid var(--a);outline-offset:1px}
.names .pl.on{background:var(--ink);color:var(--bg)}
.here.swap{border-color:var(--a);background:var(--a-soft)} .here.swap span{color:var(--a)}
.gbox{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px}
.gbox .grow2{display:grid;grid-template-columns:1fr 44px;gap:8px}
.gpick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:6px 10px;align-items:center}
.gpick label{overflow-wrap:anywhere;font-size:15px}
details.past.grp{border-top:0;padding-top:0} details.grp summary b{font-family:var(--display);font-size:20px;text-transform:uppercase}
details.grp>*+*{margin-top:10px}
tr.grph td{background:var(--bg);text-align:left;white-space:normal;padding-top:10px}
.glabel{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding:10px 0 4px;margin-top:4px}
.glabel b{font-family:var(--display);font-size:17px;text-transform:uppercase}
.glabel span{font-size:13px;color:var(--muted)}
.subbox{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:12px;padding:10px}
.winrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.win{min-height:72px;border:0;border-radius:14px;font-family:var(--display);font-size:22px;line-height:1.1;padding:0 8px;text-transform:uppercase;color:var(--on-team);letter-spacing:.02em}
.win.wa{background:var(--a)} .win.wb{background:var(--b)}
.win.hit{box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--good)}
.win:active,.btn:active,.pts button:active{transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);min-height:56px;font-size:18px;width:100%}
.btn.danger{color:var(--warn)}
.btn.grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.chips li{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;background:var(--bg)}
.next{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.next .names{font-size:14px;font-weight:400}
.dotA::before,.dotB::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.dotA::before{background:var(--a)} .dotB::before{background:var(--b)}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;overflow-wrap:anywhere}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
tr.left td{color:var(--muted)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
input:disabled{opacity:.7;border-style:dashed}
input.miss{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
input[type=text],input[type=number],input[type=date],input[type=time]{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;width:100%;min-width:0}
.kv input{width:150px;text-align:right;flex:none}
.kv>label,.kv>span{min-width:0}
.kv .btn{flex:none}
.roster{display:flex;flex-direction:column;gap:8px}
.roster .r{display:grid;grid-template-columns:28px 1fr 62px 44px;gap:8px;align-items:center}
.here{min-height:44px;border-radius:10px;border:1px solid var(--good);background:var(--good-soft);color:var(--good);font-size:14px;font-weight:600;padding:0}
.here.off,.here.st-late{border-color:var(--line);background:var(--surface);color:var(--muted)}
.here.st-out{border-color:var(--line);border-style:dashed;background:var(--bg);color:var(--warn)}
.att .here.st-out b{color:var(--muted);text-decoration:line-through}
.roster .n{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.x{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.stepper button{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:28px;font-family:var(--display)}
.stepper input{min-height:56px;text-align:center;font-family:var(--display);font-size:30px}

.game{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.game:first-of-type{border-top:0;padding-top:0}
.game .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.game .head b{font-family:var(--display);font-size:20px;text-transform:uppercase}
.pill{border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--good-soft);color:var(--good)}
.line{font-size:15px;color:var(--muted)}
.line.won{color:var(--ink);font-weight:500}
.empty{color:var(--muted);text-align:center;padding:16px 0}
.timer{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.timer .label,.timer .sub{color:inherit;opacity:.8}
.timer b{font-family:var(--display);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.top .meta{font-variant-numeric:tabular-nums}
details.past{border-top:1px solid var(--line);padding-top:6px}
details.past summary{cursor:pointer;padding:8px 0;min-height:44px}
details.past summary .sub{display:block}
details.past>*+*{margin-top:10px}
details.past .line{font-size:14px}
details.sched{border-top:0;padding-top:0}
th:first-child{white-space:nowrap;overflow-wrap:normal}
details.sched summary{padding:0}
details.sched summary b{font-family:var(--display);font-size:20px;text-transform:uppercase}
details.sched .label{display:block;border-top:1px solid var(--line);padding-top:12px}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:8px}
.tabs button{min-height:52px;border:0;border-radius:12px;background:transparent;font-family:var(--display);font-size:20px;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-current=true]{background:var(--ink);color:var(--bg)}
body.setup .tabs{display:none}
.winrow.wait{opacity:.4;pointer-events:none}
.lineup{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:12px;padding:10px}
.lineup .teams>div{display:flex;flex-direction:column;gap:6px;min-width:0}
select.slot{min-height:40px;width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:0 6px}
.filebtn{display:flex;align-items:center;justify-content:center;cursor:pointer}
.att{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.att .here{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:6px 12px;min-height:54px;text-align:left;min-width:0}
.att .here b{color:var(--ink);font-size:15px;overflow-wrap:anywhere}
.att .here span{font-size:12px}
.warnbox{border-color:var(--warn)} .warnbox h2{color:var(--warn)}
ol.log{list-style:none;margin:0;padding:0;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
ol.log .num{color:var(--ink);font-weight:600;margin-right:6px}
.timer.low{background:var(--warn)}
.fair{color:var(--good);font-weight:600}
.btn.sw{align-self:flex-start;min-height:40px;font-size:14px;font-weight:500}
.tick{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;color:var(--on-team);line-height:1}
.tick.on{background:var(--good);border-color:var(--good)}
.tick.part{border-color:var(--b);color:var(--b)}
.payed{display:flex;flex-direction:column;gap:8px;text-align:left;white-space:normal;padding:4px 0 8px}
.payed label{font-size:13px;color:var(--muted)}
tr.payrow td{background:var(--bg);padding:8px;white-space:normal}
.payed .btn{min-width:0;padding:0 6px;flex:1 1 0}
.payed .row{flex-wrap:nowrap}
td .pi{display:block;white-space:normal;font-size:13px}
td .wl{display:block;white-space:nowrap}
td:has(.tick){width:44px;padding-right:0}
tr.paid td{color:var(--muted)} tr.paid td b{text-decoration:line-through;font-weight:500}
textarea.sum{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;resize:vertical}
body.ro .ctl{display:none!important}
#toast{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;pointer-events:none}
#toast .wrap>div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
#toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;min-height:36px;padding:0 12px;font-weight:600}
@media (max-width:360px){.stats{grid-template-columns:repeat(2,1fr)}.score{font-size:52px}.win{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header class="top"><div class="wrap">
  <h1>Pickup Hoops</h1>
  <div class="meta"><span id="clock"></span><span id="sync" class="off">Saved on this phone</span></div>
</div></header>
<main class="wrap" id="view"></main>
<div id="toast" hidden><div class="wrap"><div><span id="toastMsg"></span><button id="toastUndo" class="ctl" data-act="undo">Undo</button></div></div></div>
<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button data-act="tab" data-tab="game">Game</button>
  <button data-act="tab" data-tab="players">Players</button>
  <button data-act="tab" data-tab="history">History</button>
</div></nav>

<script>
(function(){
const LS='pickup-hoops-v1', TEAM=5, MAX_ARCHIVE=60;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=x=>'€'+(Math.round(x*100)/100).toFixed(2);
const signed=x=>(x>0.004?'+':x<-0.004?'−':'')+eur(Math.abs(x));

function fresh(count){
  const s={v:1,updatedAt:0,phase:'setup',place:'',date:today(),start:'',end:'',hours:0,rate:31.25,fee:0,prize:2,target:17,nextId:1,players:[],current:null,next:null,maxLoss:0,noShowPays:true,cutoff:'void',roundShare:'euro',groups:[],nextG:0,history:[],log:[],archive:[],startedAt:null,endedAt:null,rev:0,by:''};
  for(let i=0;i<(count||15);i++)s.players.push(mkPlayer(s));
  return s;
}
function mkPlayer(s){const n=s.nextId++;return{id:'p'+n,num:n,name:'',active:true,played:0,rested:0,wins:0,offset:0}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function normalize(r){const b=fresh(0);b.players=[];Object.assign(b,r||{});if(r&&r.rate==null){b.hours=3;b.rate=Math.round(b.fee/3*100)/100}if(b.end==null)b.end='';syncHours(b);return b}
function mins(t){const m=/^(\d\d):(\d\d)/.exec(t||'');return m?(+m[1])*60+(+m[2]):null}
/* Start and end time give the booked hours, and hours times the hourly price give the court total. */
function syncHours(s){
  const a=mins(s.start),b=mins(s.end);
  if(a==null||b==null){if(s.phase==='setup'){s.hours=0;s.fee=0}return}   // both times are needed before anything is charged
  let d=b-a;if(d<=0)d+=1440;
  s.hours=Math.round(d/60*100)/100;s.fee=Math.round(s.rate*s.hours*100)/100;
}

let S=fresh(), tab='game', canWrite=true, armReset=false, armEnd=false, needsRender=false, armDel=-1, copyShown=null;
const openSet=new Set([-1]);   // which schedule cards in History are open
let DEV='';try{DEV=localStorage.getItem(LS+'-dev')||'';if(!DEV){DEV=Math.random().toString(36).slice(2,10);localStorage.setItem(LS+'-dev',DEV)}}catch(e){}
if(!DEV)DEV=Math.random().toString(36).slice(2,10);
try{const raw=localStorage.getItem(LS);if(raw)S=normalize(JSON.parse(raw));tab=localStorage.getItem(LS+'-tab')||'game'}catch(e){}
/* link: 'none' = opened as a plain file, 'connecting', 'shared' = live session, 'detached' = published but no shared data (signed out, or it failed to load). */
let link=(window.claude&&window.claude.use)?'connecting':'none', allowLocal=false, armLocal=false;
if(link==='connecting'&&!((S.rev||0)>0&&S.by===DEV))canWrite=false;   // a device that never ran the session waits for the shared copy before showing controls

/* ---------- rotation ---------- */
const byId=id=>S.players.find(p=>p.id===id);
const nm=id=>{const p=byId(id);return p?(p.name.trim()||'Player '+p.num):'Player'};
const inSession=()=>S.players.filter(p=>!p.out);                       // the player list is the database; "out" = not coming today
const active=()=>S.players.filter(p=>p.active&&!p.away&&!p.ns&&!p.out);   // the players the rotation may use right now
const listed=()=>S.players.filter(p=>p.active&&!p.out);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function restStreak(id){let n=0;for(let i=S.history.length-1;i>=0;i--){if(S.history[i].rest.indexOf(id)>=0)n++;else break}return n}
/* Win rate from past schedules, matched by name. Unnamed players and new names count as average (0.5). */
function priors(){
  const m={};
  (S.archive||[]).forEach(s=>s.players.forEach(p=>{if(!p.played||/^Player \d+$/.test(p.name))return;const k=p.name.trim().toLowerCase();m[k]=m[k]||{w:0,g:0};m[k].w+=p.wins;m[k].g+=p.played}));
  return m;
}
function poolNow(){
  const m=priors();
  return active().map(p=>{const r=m[p.name.trim().toLowerCase()];return{id:p.id,eff:p.played+p.offset,streak:restStreak(p.id),wins:p.wins,skill:p.wins+(r?r.w/r.g:0.5)}});
}
function poolAfterCurrent(){
  const c=S.current;if(!c)return poolNow();
  const on=c.a.concat(c.b);
  return poolNow().map(x=>Object.assign({},x,on.indexOf(x.id)>=0?{eff:x.eff+1,streak:0}:{streak:x.streak+1}));
}
/* Fewest games first, then longest wait, random on ties. Teams are split to even out strength: wins today plus win rate from past schedules. */
function lineup(pool){
  const per=Math.min(TEAM,Math.floor(pool.length/2));
  const order=shuffle(pool.slice()).sort((x,y)=>x.eff-y.eff||y.streak-x.streak);
  const on=order.slice(0,per*2), rest=order.slice(per*2);
  const sum=t=>t.reduce((n,x)=>n+x.skill,0), ids=t=>t.map(x=>x.id);
  let best=null;
  for(let i=0;i<200;i++){const s=shuffle(on.slice()),a=s.slice(0,per),b=s.slice(per),d=Math.abs(sum(a)-sum(b));if(!best||d<best.d)best={d,a,b};if(d<0.05)break}

/* Per-group totals for the payments. Players without a group are collected by the organizer. */
function groupTotals(e,rows){
  const G=(e.groups||[]).slice(),out=[];
  const one=(id,name)=>{const r=rows.filter(o=>id?o.p.g===id:!(G.some(g=>g.id===o.p.g)));if(!r.length&&id===null)return;
    const c=r.find(o=>o.p.collect);const sum=(sign,done)=>r.reduce((n,o)=>n+(sign*o.due>0?(done?o.got||0:Math.abs(o.due)):0),0);

  G.forEach(g=>one(g.id,g.name));one(null,'No group');
  return out;
}

/* Court share is rounded UP to the cent, so the players' shares always cover the court. */
/* Court share and prize for every player of one schedule, after the rules:
   - a no-show who is not charged (ns) is left out of the court split;
   - nobody loses more than maxLoss in prizes; when that cap bites, winners are paid the same fraction of
     their winnings, rounded down to the cent, so what is handed out never exceeds what was collected. */
function money(e){
  const P=e.players,sh=shareOf(e.fee,P.filter(p=>!p.ns).length,e.roundShare),cap=e.maxLoss>0?e.maxLoss:Infinity;
  const raw=P.map(p=>(2*p.wins-p.played)*e.prize),lost=raw.map(x=>x<0?Math.min(-x,cap):0);
  const pot=lost.reduce((a,b)=>a+b,0),won=raw.reduce((a,x)=>a+(x>0?x:0),0),f=won>0?Math.min(1,pot/won):1;
  return{sh,f,capped:raw.some(x=>-x>cap+0.004),rows:P.map((p,k)=>{
    const pr=raw[k]<0?-lost[k]:(f<1?Math.floor(raw[k]*f*100+1e-6)/100:raw[k]),court=p.ns?0:sh;
    return{p,k,pr,court,due:court-pr,hitCap:-raw[k]>cap+0.004}})};
}
/* Court share per player, always rounded up so the court is covered.
   'euro' = up to a whole euro (8.04 becomes 9.00); 'cent' = up to the cent, as schedules saved before Nov 22 were settled. */
function shareOf(fee,n,mode){if(!n)return 0;return mode==='euro'?Math.ceil(fee/n-1e-6):Math.ceil(fee/n*100-1e-6)/100}
function share(){return shareOf(S.fee,inSession().filter(p=>!p.ns).length,S.roundShare)}
function paidOut(){return S.players.reduce((n,p)=>n+p.wins,0)*S.prize}

  if(!canWrite&&link==='connecting')return '<section class="card"><h2>Connecting…</h2><p class="sub">Loading the shared session.</p></section>';
  if(!canWrite)return '<section class="card"><h2>Not started yet</h2><p class="sub">The organizer is still setting up the players. This page updates by itself when the first game starts.</p></section>';
  if(attend)return viewAttend();
  return `<section class="card">
    <header><h2>Who is playing?</h2><span class="sub">5v5 · first to ${S.target}</span></header>
    <div><label class="label" for="count">Number of players</label>
    <div class="stepper"><button data-act="count" data-n="-1" aria-label="One player fewer">−</button>
      <input id="count" type="number" inputmode="numeric" min="2" max="40" value="${S.players.length}" data-f="count">
      <button data-act="count" data-n="1" aria-label="One player more">+</button></div></div>
    <p class="sub">${(n=>n>=10?`${n} playing today: 10 play each game, ${n-10} rest.`:`${n} playing today, so games are ${Math.floor(n/2)}v${Math.floor(n/2)}.`)(inSession().length)} Court share: <b class="num" id="oShare">${eur(share())}</b> each${S.roundShare==='euro'?', rounded up to whole euros':''}.</p>
  </section>
  <section class="card">
    <header><h2>Names</h2><span class="sub">Blank keeps “Player 1”</span></header>
    <div class="roster">${byGroupHTML(S.players,p=>`<div class="r"><span class="n">${p.num}</span>
      <input type="text" id="name-${p.id}" data-f="name" data-id="${p.id}" value="${esc(p.name)}" placeholder="Player ${p.num}" maxlength="24" autocomplete="off" aria-label="Name of player ${p.num}">
      <button class="here st-${statusOf(p)}" data-act="away" data-id="${p.id}" aria-label="${statusLabel[statusOf(p)]}: player ${p.num}">${statusOf(p)==='out'?'Out':statusLabel[statusOf(p)]}</button>
      <button class="x" data-act="remove" data-id="${p.id}" aria-label="Remove player ${p.num}">×</button></div>`)}</div>
    <p class="sub">This list is kept for every session. Tap Here to switch to Late, then to Out (not coming today). Out players are not charged and not in the teams, and stay on the list for next time.</p>
    <button class="btn" data-act="add">+ Add player</button>
  </section>
  ${groupsCard()}
  <section class="card">
    <header><h2>Court and schedule</h2></header>
    ${sessionFields()}
    <div class="kv"><label for="prize">Prize per winning player (€)</label><input id="prize" type="text" inputmode="decimal" data-f="prize" value="${S.prize}"></div>
  </section>
  ${rulesCard()}
  <button class="btn primary" data-act="attend">Start session</button>${pastHist()}${backupCard()}`;   // restore is reachable on a fresh, empty app too
}

function rulesCard(){
  const live=S.phase!=='setup',ed=canWrite&&!live;
  const val=(k,on,off)=>ed?`<button class="btn" data-act="rule" data-k="${k}">${S[k]===on[0]?on[1]:off[1]}</button>`:`<b>${S[k]===on[0]?on[1]:off[1]}</b>`;
  return `<section class="card">
    <header><h2>Rules</h2>${ed?'<span class="sub">Tap to change</span>':''}</header>
    <div>
      <div class="kv"><label for="maxLoss">Most a player can lose in prizes per day (€, 0 = no limit)</label><input id="maxLoss" type="text" inputmode="decimal" data-f="maxLoss" value="${S.maxLoss||0}" ${ed?'':'disabled'}></div>
      <div class="kv"><span>Confirmed but never came</span>${val('noShowPays',[false,'Does not pay'],[true,'Pays court share'])}</div>
      <div class="kv"><span>Game cut off when time runs out</span>${val('cutoff',['leader','Leader wins'],['void','Not counted'])}</div>
    </div>
    <p class="sub">${S.maxLoss>0?`With a max loss, winners are paid a little less whenever someone hits the limit, so the money still adds up. `:''}${S.noShowPays===false?'A player still marked “Late” with no games when you end the session is left out, and the others’ court share goes up. ':''}${S.cutoff==='leader'?'Enter the score during the game: at End session the team ahead gets the win; a tie is not counted. ':''}${live?'Rules are locked while the session is running.':''}</p>
  </section>`;
}
function viewDone(){
  return `<section class="card">
      <header><h2>Session ended</h2><span class="sub">${S.history.length} game${S.history.length===1?'':'s'}</span></header>
      <p class="sub">${schedLine()}. Tick each player off once they have paid, or once you have handed them their winnings.</p>
      ${settleHTML(archiveEntry(S),-1,canWrite)}

    </section>
    ${canWrite?(stale=>`<section class="card${stale?' warnbox':''}">
      <header><h2>Backup</h2></header>
      <p class="sub">${stale?'This schedule is not backed up yet. Copy the backup and paste it somewhere safe, for example your notes, before you reset.':'Backed up. Copy it again if you change payments.'}</p>
      <div class="row"><button class="btn grow" data-act="backup">Copy backup</button>${standalone()?'<button class="btn grow" data-act="backupfile">Save backup file</button>':''}</div>
      ${backupText?`<textarea id="backupText" class="sum" readonly rows="4" aria-label="Backup text">${esc(backupText)}</textarea>`:''}
    </section>`)(!S.backupAt||S.backupAt<(S.endedAt||0)):''}
    <div class="row ctl"><button class="btn grow" data-act="resume">Resume session</button>
      <button class="btn grow danger" data-act="reset">${resetLabel()}</button></div>
    <p class="sub ctl">Resume if you ended by mistake. Reset saves this schedule, with its ticks, under History.</p>`;
}
function viewGame(){
  if(S.phase==='done')return viewDone();
  const c=S.current;if(!c)return '<p class="empty">No game running.</p>';
  const hitA=c.sa>=S.target&&c.sa>c.sb, hitB=c.sb>=S.target&&c.sb>c.sa;
  const team=(k,L,ids,sc)=>`<section class="team t${k}"><h3>Team ${L}</h3><div class="score num" aria-label="Team ${L} score">${sc}</div>
    <div class="pts ctl"><button data-act="pt" data-side="${k}" data-n="1">+1</button><button data-act="pt" data-side="${k}" data-n="2">+2<small>three</small></button><button data-act="pt" data-side="${k}" data-n="-1" aria-label="Take one point off Team ${L}">−</button></div>
    <ol class="names">${canWrite?ids.map(id=>`<li><button class="pl${subFor===id?' on':''}" data-act="subfor" data-id="${id}" aria-pressed="${subFor===id?'true':'false'}">${esc(nm(id))}</button></li>`).join(''):li(ids)}</ol></section>`;
  const nx=S.next;
  return `<div class="timer"><span class="label" id="tLabel">Time left</span><b id="tLeft">--:--:--</b><span class="sub">${schedLine()}</span></div><div class="stats">
      <div><b class="num">${active().length}</b><span class="label">Players</span></div>
      <div><b class="num">${c.n}</b><span class="label">Game now</span></div>
      <div><b class="num">${S.history.length}</b><span class="label">Played</span></div>
      <div><b class="num">${eur(paidOut())}</b><span class="label">Prizes</span></div>
    </div>
    <section class="card">
      <header><h2>Game ${c.n}</h2><span class="sub">First to ${S.target} · threes count 2</span></header>
      <div class="teams">${team('a','A',c.a,c.sa)}${team('b','B',c.b,c.sb)}</div>
      ${canWrite&&subFor&&c.a.concat(c.b).indexOf(subFor)>=0?(()=>{const rs=c.rest.filter(id=>{const p=byId(id);return p&&p.active&&!p.away&&!p.ns});
        const mine=c.a.indexOf(subFor)>=0?'A':'B',opp=mine==='A'?c.b:c.a;
        return `<div class="subbox">${c.started?'':`<span class="label">Swap ${esc(nm(subFor))} with someone on Team ${mine==='A'?'B':'A'}</span>
          <div class="att">${opp.map(id=>`<button class="here swap" data-act="swapwith" data-id="${id}"><b>${esc(nm(id))}</b><span>${byId(id)?byId(id).wins:0} win${byId(id)&&byId(id).wins===1?'':'s'} today</span></button>`).join('')}</div>`}
          <span class="label">${c.started?'Who comes on for '+esc(nm(subFor))+'?':'Or bring on a resting player'}</span>
          ${rs.length?`<div class="att">${rs.map(id=>{const p=byId(id);return `<button class="here" data-act="subin" data-id="${id}"><b>${esc(nm(id))}</b><span>${p.played} game${p.played===1?'':'s'} so far</span></button>`}).join('')}</div>`:'<p class="sub">Nobody is resting right now.</p>'}
          <button class="btn" data-act="subcancel">Cancel</button></div>`})():(canWrite?`<p class="sub ctl">${c.started?'Tap a player on court to bring on a resting player.':'Tap a player to swap teams or bring on a resting player before the game starts.'}</p>`:'')}
      <div class="winrow ctl${Date.now()<winLockUntil?' wait':''}">
        <button class="win wa${hitA?' hit':''}" data-act="win" data-side="A">Team A won</button>
        <button class="win wb${hitB?' hit':''}" data-act="win" data-side="B">Team B won</button>
      </div>
      ${hitA||hitB?`<p class="sub ctl">Team ${hitA?'A':'B'} reached ${S.target}. Tap the winner button to record it.</p>`:''}
      ${listed().some(p=>p.away)?`<div><span class="label">Not here yet / away</span><ul class="chips">${li(listed().filter(p=>p.away).map(p=>p.id))}</ul></div>`:''}
      <div><span class="label">Resting (${c.rest.length})</span>
        ${c.rest.length?`<ul class="chips">${li(c.rest)}</ul>`:'<p class="sub">Nobody. Everyone is on court.</p>'}</div>
      ${(k=>k===1?'<p class="sub fair">After this game everyone has played the same number of games. A fair point to stop.</p>':k>1?`<p class="sub">Everyone is level again in ${k} games, counting this one.</p>`:'')(gamesToLevel())}
      <div class="row ctl">${c.started?'':`<button class="btn grow" data-act="tipoff">Start game ${c.n}</button><button class="btn grow" data-act="redraw">Redraw teams</button>`}
        ${S.history.length?'<button class="btn grow" data-act="undo">Undo last result</button>':''}</div>
    </section>
    ${nx?`<section class="card">
      <header><h2>Up next: Game ${c.n+1}</h2><button class="btn ctl" data-act="reshuffle">Reshuffle</button></header>
      <div class="next"><div><span class="label dotA">Team A</span><ol class="names">${li(nx.a)}</ol></div>
        <div><span class="label dotB">Team B</span><ol class="names">${li(nx.b)}</ol></div></div>
      ${nx.rest.length?`<p class="sub">Resting next: ${csv(nx.rest)}</p>`:''}
    </section>`:''}
    <p class="sub">Court ${eur(S.fee)} ÷ ${inSession().filter(p=>!p.ns).length} players = <b class="num">${eur(share())}</b> each.</p>
    <button class="btn danger ctl" data-act="end">${armEnd?(cutoffSide()?'Tap again. Game '+c.n+' counts as a Team '+cutoffSide()+' win at '+c.sa+'–'+c.sb+'.':'Tap again. Game '+c.n+' in progress will not be counted.'):'End session'}</button>`;
}

function viewPlayers(){
  const rows=inSession().sort((x,y)=>y.wins-x.wins||y.played-x.played||x.num-y.num),M=money(archiveEntry(S)).rows;
  return `<section class="card">
      <header><h2>Standings</h2><span class="sub">${S.history.length} game${S.history.length===1?'':'s'}</span></header>
      <div class="scroll"><table><thead><tr><th>Player</th><th>Played</th><th>Rest</th><th>W</th><th>L</th><th>Prize</th></tr></thead><tbody>
      ${rows.map(p=>`<tr class="${p.active?'':'left'}"><td>${esc(nm(p.id))}${p.active?(p.away?' (away)':''):' (left)'}</td><td>${p.played}</td><td>${p.rested}</td><td>${p.wins}</td><td>${p.played-p.wins}</td><td>${signed(M[inSession().indexOf(p)].pr)}</td></tr>`).join('')}
      </tbody></table></div>
    </section>
    <section class="card">
      <header><h2>Settle up</h2><span class="sub">${S.phase==='done'?'Final':'So far'}</span></header>
      <p class="sub">Court share, plus ${eur(S.prize)} for every loss, minus ${eur(S.prize)} for every win. The losing team pays the winners; resting players pay nothing for that game.</p>
      ${settleHTML(archiveEntry(S),-1,canWrite&&S.phase==='done')}
      ${S.phase==='done'?'':'<p class="sub">These amounts still change with every game. End the session to tick off who has paid.</p>'}
    </section>
    <section class="card">
      <header><h2>Court and prize</h2></header>
      <div>
        ${sessionFields()}
        <div class="kv"><span>Players sharing the court</span><b>${inSession().filter(p=>!p.ns).length}</b></div>
        <div class="kv"><span>Each player pays</span><b>${eur(share())}</b></div>
        <div class="kv"><label for="prize">Prize per winning player (€)</label><input id="prize" type="text" inputmode="decimal" data-f="prize" value="${S.prize}" disabled></div>
        <div class="kv"><span>Total prize money won</span><b>${eur(paidOut())}</b></div>
      </div>
    </section>
    ${rulesCard()}
    ${S.phase==='done'?'':`<section class="card ctl">
      <header><h2>Roster</h2><span class="sub">${active().length} here${listed().length>active().length?', '+(listed().length-active().length)+' away':''}</span></header>
      <div class="roster">${byGroupHTML(listed(),p=>`<div class="r"><span class="n">${p.num}</span>
        <input type="text" id="name-${p.id}" data-f="name" data-id="${p.id}" value="${esc(p.name)}" placeholder="Player ${p.num}" maxlength="24" autocomplete="off" aria-label="Name of player ${p.num}">
        <button class="here${p.away?' off':''}" data-act="away" data-id="${p.id}" aria-pressed="${p.away?'false':'true'}" aria-label="${p.away?'Away':'Here'}: ${esc(nm(p.id))}">${p.away?'Away':'Here'}</button>
        <button class="x" data-act="remove" data-id="${p.id}" aria-label="${p.played?'Mark '+esc(nm(p.id))+' as left':'Mark '+esc(nm(p.id))+' as not coming'}">×</button></div>`)}</div>
      <button class="btn" data-act="add">+ Add new player</button>
      ${(o=>o.length?`<span class="label">Not coming today</span><div class="att">${o.map(p=>`<button class="here st-out" data-act="cameanyway" data-id="${p.id}"><b>${esc(nm(p.id))}</b><span>Came after all? Tap to add</span></button>`).join('')}</div>`:'')(S.players.filter(p=>p.active&&p.out))}
      <p class="sub">Tap “Here” to take someone out of the rotation for a while and “Away” to bring them back. × on someone with no games marks them as not coming (not charged). × on someone who has played marks them as left; they still share the court cost. New and returning players join level with whoever has played least.</p>
    </section>`}
    ${groupsCard()}
    <button class="btn danger ctl" data-act="reset">${resetLabel()}</button>`;

/* History: one card per pickup schedule, the running one first, then older ones newest first. */
function viewHistory(){
  const A=S.archive||[];
  return schedCard(archiveEntry(S),-1,true)+A.map((s,i)=>schedCard(s,i,false)).reverse().join('')+backupCard();
}
function schedHead(s){
  const d=new Date(s.date+'T'+(s.start||'00:00'));
  const when=isNaN(d.getTime())?esc(s.date||'No date'):d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  return when+(s.start?' · '+esc(s.start)+(s.end?'–'+esc(s.end):''):'');
}
const gamesOf=e=>e.games.length||e.gamesCount||0;
function schedCard(s,i,now){
  const prizes=s.players.reduce((t,p)=>t+p.wins,0)*s.prize;
  const nmz=ix=>ix.map(k=>esc((s.players[k]||{}).name||'Player')).join(', ');
  return `<section class="card"><details class="past sched" data-i="${i}"${openSet.has(i)||armDel===i?' open':''}>
    <summary><b>${schedHead(s)}</b>${now?` <span class="pill">${S.phase==='done'?'Ended':'Now'}</span>`:''}<span class="sub">${s.place?esc(s.place)+' · ':''}${gamesOf(s)} game${gamesOf(s)===1?'':'s'} · court ${eur(s.fee)} · prizes ${eur(prizes)}</span></summary>
    ${s.games.length?s.games.slice().reverse().map(g=>`<div class="game">
      <div class="head"><b>Game ${g.n}</b><span class="pill">Team ${g.w} won${g.sa||g.sb?' '+(g.w==='A'?g.sa+'–'+g.sb:g.sb+'–'+g.sa):''}</span></div>
      <div class="line ${g.w==='A'?'won':''}"><span class="dotA"></span>Team A: ${nmz(g.a)}</div>
      <div class="line ${g.w==='B'?'won':''}"><span class="dotB"></span>Team B: ${nmz(g.b)}</div>
      <div class="line">Winning players (+${eur(s.prize)} each): ${nmz(g.w==='A'?g.a:g.b)}</div>
      <div class="line">Losing players (−${eur(s.prize)} each): ${nmz(g.w==='A'?g.b:g.a)}</div>
      ${canWrite?(()=>{const open=editGame&&editGame.i===i&&editGame.n===g.n;
        const opts=sel=>s.players.map((p,k)=>`<option value="${k}"${k===sel?' selected':''}>${esc(p.name)}</option>`).join('');
        const slots=(t,ix)=>ix.map((k,pos)=>`<select class="slot" data-i="${i}" data-n="${g.n}" data-t="${t}" data-pos="${pos}" aria-label="Team ${t.toUpperCase()}, place ${pos+1}">${opts(k)}</select>`).join('');
        return `<button class="btn ctl sw" data-act="editgame" data-i="${i}" data-n="${g.n}">${open?'Done editing':'Fix who played (subs)'}</button>
        ${open?`<div class="lineup"><p class="sub">Pick who actually played at the end of the game. They get the win or loss of game ${g.n}. Picking someone from the other team swaps the two.</p>
          <div class="teams"><div><span class="label dotA">Team A</span>${slots('a',g.a)}</div><div><span class="label dotB">Team B</span>${slots('b',g.b)}</div></div></div>`:''}`})():''}
      ${now&&canWrite?`<button class="btn ctl sw" data-act="switch" data-n="${g.n}">${armSwitch===g.n?'Tap again: Team '+(g.w==='A'?'B':'A')+' won instead':'Wrong winner? Switch'}</button>`:''}
    </div>`).join(''):(s.imported?'':'<p class="empty">No finished games yet. Pick a winner on the Game tab and it shows up here.</p>')}
    ${s.games.length?`<div class="row"><button class="btn grow" data-act="copygames" data-i="${i}">Copy games and teams for the group chat</button></div>
    ${copyShown&&copyShown.i===i&&copyShown.kind==='games'?`<textarea id="gamesText" class="sum" readonly rows="10" aria-label="Games and teams text">${esc(copyShown.text)}</textarea>`:''}`:''}
    ${s.imported&&!s.games.length?'<p class="sub">Imported from the summary text. Wins and losses per player are kept, but the teams of each game are not, so subs cannot be fixed here.</p>':''}
    ${gamesOf(s)?`<span class="label">Payments for this schedule</span>${settleHTML(s,i,canWrite&&(!now||S.phase==='done'))}`:''}
    ${logHTML(s,now)}
    ${now?'':`<button class="btn danger ctl" data-act="delpast" data-i="${i}">${armDel===i?'Tap again to delete':'Delete this schedule'}</button>`}
  </details></section>`;
}
function render(){
  needsRender=false;
  document.body.classList.toggle('setup',S.phase==='setup');
  document.body.classList.toggle('ro',!canWrite);
  $('#view').innerHTML=linkBanner()+(S.phase==='setup'?viewSetup():tab==='players'?viewPlayers():tab==='history'?viewHistory():viewGame());
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab===tab)));
  clock();
}
const typing=()=>{const el=document.activeElement;return !!el&&(el.tagName==='INPUT'||(el.tagName==='TEXTAREA'&&!el.readOnly))};
function softRender(){if(typing())needsRender=true;else render()}
function clock(){
  const el=$('#clock');
  const f=x=>Math.floor(x/60)+'h '+String(x%60).padStart(2,'0')+'m',now=Date.now();
  let s=sched();
  if(!s&&S.startedAt)s={st:new Date(S.startedAt),en:new Date(S.startedAt+S.hours*3600000)};
  if(!s){el.textContent='No schedule set yet';return}
  const a=s.st.getTime(),z=s.en.getTime(),ms=now<a?a-now:now<z?z-now:0,sec=Math.floor(ms/1000),dd=Math.floor(sec/86400);
  const hms=(dd?dd+'d ':'')+String(Math.floor(sec%86400/3600)).padStart(2,'0')+':'+String(Math.floor(sec%3600/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  const label=now<a?'Starts in':now<z?'Time left':'Court time is over';
  el.textContent=now<z?label+' '+hms:label;
  const tl=$('#tLeft'),tb=$('#tLabel');if(tl){tl.textContent=hms;tb.textContent=label}
  const low=S.phase==='live'&&now>=a&&now<z&&z-now<=600000,tm=$('.timer');if(tm)tm.classList.toggle('low',low);
  if(low&&warnedEnd!==z&&canWrite){warnedEnd=z;toast(Math.ceil((z-now)/60000)+' minutes of court time left.');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
}
let toastT,attend=false,winLockUntil=0,armWin='',armSwitch=0,armRestore=false,armRedraw=false,payEdit=null,editGame=null,subFor=null,groupsOpen=false,armDelGroup='',backupText='',restoreOpen=false,restoreDraft='',warnedEnd=0;
function toast(msg,undo){$('#toastMsg').textContent=msg;$('#toastUndo').hidden=!undo;$('#toast').hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{$('#toast').hidden=true},6000)}

/* ---------- saving ---------- */
function cache(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function stamp(){S.rev=(S.rev||0)+1;S.by=DEV;S.updatedAt=Date.now()}
function commit(){stamp();cache();queuePush();softRender()}
let docRef=null,pushing=false,dirty=false,pushT,retryT,retries=0,loadT;
function setSync(text,off){const el=$('#sync');el.textContent=text;el.classList.toggle('off',!!off)}
function queuePush(){if(!docRef||!canWrite)return;dirty=true;clearTimeout(pushT);pushT=setTimeout(push,400)}
async function push(){
  if(pushing||!dirty||!docRef)return;
  pushing=true;dirty=false;clearTimeout(retryT);
  try{await docRef.set(JSON.parse(JSON.stringify(S)));retries=0;setSync('Saved')}
  catch(e){
    if(e&&e.code==='invalid_argument'){canWrite=false;setSync('View only',true);render()}
    else{dirty=true;retries++;clearTimeout(retryT);setSync('Saved on this phone, retrying',true);retryT=setTimeout(push,Math.min(60000,3000*retries))}   // keep trying until it is stored online
  }
  pushing=false;if(dirty&&retries===0)push();
}
/* Which copy is newer: 1 = the stored one, -1 = this device, 0 = same. Uses the revision counter, not device clocks. */
function compare(r){
  const a=r.rev||0,b=S.rev||0;
  if(a!==b)return a>b?1:-1;
  if(a===0)return r.updatedAt>S.updatedAt?1:r.updatedAt<S.updatedAt?-1:0;   // data saved before revisions existed
  return (r.by||'')===(S.by||'')?0:1;                                        // same revision from another device: the stored one wins
}
async function connect(){
  let db=null,user=null;
  try{db=await window.claude.use('db');user=await window.claude.use('user')}catch(e){}
  if(!db){link='detached';canWrite=allowLocal;setSync('Not connected',true);render();return}
  link='shared';let w=true;
  try{if(user&&((await user.can('data.write'))===false||(await user.canEdit())===false))w=false}catch(e){}
  canWrite=w;render();
  docRef=db.doc('sessions/current');
  loadT=setTimeout(()=>setSync(canWrite?'Saved on this phone':'Can’t reach the session yet',true),10000);
  docRef.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const live=!snap.metadata.fromCache, r=snap.exists?snap.data():null;
    if(live)clearTimeout(loadT);
    const c=r?compare(r):((S.rev||0)>0||S.updatedAt>0?-1:0);
    if(c>0){const mine=(S.rev||0)>0&&S.by===DEV&&(dirty||pushing);S=normalize(JSON.parse(JSON.stringify(r)));dirty=false;cache();softRender();if(mine)toast('Updated from another device. Your last change here was replaced.')}
    else if(c<0&&live&&!pushing&&!dirty)queuePush();
    if(live&&!pushing&&!dirty)setSync(canWrite?'Saved':'View only',!canWrite);
  },()=>{clearTimeout(loadT);setSync(canWrite?'Saved on this phone':'View only',true)});
}
window.addEventListener('online',()=>{if(dirty){clearTimeout(retryT);push()}});

/* Keep the phone screen on while a session is running. Not every browser allows it. */
let wake=null;
async function keepAwake(){
  try{if(S.phase==='live'&&!wake&&navigator.wakeLock&&document.visibilityState==='visible'){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}
    else if(S.phase!=='live'&&wake){await wake.release();wake=null}}catch(e){wake=null}
}
document.addEventListener('visibilitychange',keepAwake);

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act==='tab'){tab=b.dataset.tab;try{localStorage.setItem(LS+'-tab',tab)}catch(x){}armReset=false;armEnd=false;armRedraw=false;copyShown=null;payEdit=null;backupText='';restoreOpen=false;armSwitch=0;render();window.scrollTo(0,0);return}
  if(act==='copy'){copySummary(Number(b.dataset.i));return}
  if(act==='copygames'){copyText(Number(b.dataset.i),'games');return}
  if(act==='reload'){location.reload();return}
  if(act==='local'){if(armLocal){allowLocal=true;armLocal=false;canWrite=true;setSync('This phone only',true);render()}else{armLocal=true;render();setTimeout(()=>{if(armLocal){armLocal=false;softRender()}},4000)}return}
  if(!canWrite)return;
  keepAwake();
  if(act==='count')setCount(S.players.length+Number(b.dataset.n));
  else if(act==='add')addPlayer();
  else if(act==='remove')removePlayer(b.dataset.id);
  else if(act==='away')toggleAway(b.dataset.id);
  else if(act==='cameanyway')cameAnyway(b.dataset.id);
  else if(act==='start')startSession();
  else if(act==='attend'){const m=missing();if(m.length)return needDetails(m);attend=true;render();window.scrollTo(0,0)}
  else if(act==='attendback'){attend=false;render();window.scrollTo(0,0)}
  else if(act==='pt')point(b.dataset.side,Number(b.dataset.n));
  else if(act==='win')recordWinner(b.dataset.side);
  else if(act==='undo'){$('#toast').hidden=true;undoLast()}
  else if(act==='redraw')redraw();
  else if(act==='tipoff')tipOff();
  else if(act==='subfor'){subFor=subFor===b.dataset.id?null:b.dataset.id;render()}
  else if(act==='subin'){if(subFor)doSub(subFor,b.dataset.id)}
  else if(act==='swapwith'){if(subFor)doSwap(subFor,b.dataset.id)}
  else if(act==='subcancel'){subFor=null;render()}
  else if(act==='editgame'){const i=Number(b.dataset.i),n=Number(b.dataset.n);editGame=editGame&&editGame.i===i&&editGame.n===n?null:{i,n};openSet.add(i);render()}
  else if(act==='addgroup')addGroup();
  else if(act==='delgroup'){const g=b.dataset.g;if(armDelGroup===g)delGroup(g);else{armDelGroup=g;render();setTimeout(()=>{if(armDelGroup===g){armDelGroup='';softRender()}},4000)}}
  else if(act==='ns')toggleNs(Number(b.dataset.i),Number(b.dataset.k));
  else if(act==='switch'){const n=Number(b.dataset.n);if(armSwitch===n)switchWinner(n);else{armSwitch=n;render();setTimeout(()=>{if(armSwitch===n){armSwitch=0;softRender()}},4000)}}
  else if(act==='backup')copyBackup();
  else if(act==='backupfile')saveBackupFile();
  else if(act==='restoreopen'){restoreOpen=!restoreOpen;armRestore=false;render()}
  else if(act==='restore'){if(armRestore)restoreBackup();else{armRestore=true;render();setTimeout(()=>{if(armRestore){armRestore=false;softRender()}},5000)}}
  else if(act==='rule'){if(S.phase!=='setup')return;const k=b.dataset.k;if(k==='noShowPays')S.noShowPays=S.noShowPays===false;else if(k==='cutoff')S.cutoff=S.cutoff==='leader'?'void':'leader';commit()}
  else if(act==='payset')paySet(b.dataset.how);
  else if(act==='payclear')payClear();
  else if(act==='paid')togglePaid(Number(b.dataset.i),Number(b.dataset.k));
  else if(act==='resume')resumeSession();
  else if(act==='end'){if(armEnd)endSession();else{armEnd=true;render();setTimeout(()=>{if(armEnd){armEnd=false;softRender()}},4000)}}
  else if(act==='delpast'){const i=Number(b.dataset.i);if(armDel===i){S.archive.splice(i,1);armDel=-1;openSet.clear();openSet.add(-1);copyShown=null;commit();toast('Schedule deleted')}else{armDel=i;render()}}
  else if(act==='reshuffle'){if(S.current)logAct('Next teams (game '+(S.current.n+1)+') reshuffled');refreshNext();commit()}
  else if(act==='reset'){if(armReset)newSession();else{armReset=true;render();setTimeout(()=>{if(armReset){armReset=false;softRender()}},4000)}}
});
document.addEventListener('change',e=>{
  const el=e.target,f=el.dataset&&el.dataset.f;if(!f||!canWrite)return;
  if(f==='gname'||f==='gby'||f==='pgroup')return groupChange(el,f);
  if(S.phase!=='setup'&&f!=='name'&&f!=='target')return;
  if(f==='name'){const p=byId(el.dataset.id);if(p){const v=el.value.slice(0,24),k=v.trim().toLowerCase();
    if(k&&S.players.some(x=>x!==p&&x.name.trim().toLowerCase()===k)){el.value=p.name;return toast('Another player is already called '+v.trim()+'. Add an initial so you can tell them apart.')}
    const was=nm(p.id);p.name=v;if(S.phase!=='setup'&&was!==nm(p.id))logAct('Player renamed: '+was+' is now '+nm(p.id));needsRender=true;stamp();cache();queuePush()}}
  else if(f==='count')setCount(Number(el.value));
  else if(f==='place'||f==='date'||f==='start'||f==='end'){S[f]=String(el.value).slice(0,40);syncHours(S);needsRender=true;stamp();cache();queuePush()}
  else{if(f==='target'&&S.phase==='live'&&S.current&&(S.current.sa||S.current.sb)){el.value=S.target;return toast('Finish this game first. The points to win can only change while the score is 0–0.')}
    const v=parseFloat(String(el.value).replace(',','.'));if(isFinite(v)&&v>=0&&((f!=='hours'&&f!=='target')||v>=1)){S[f]=f==='target'?Math.round(v):Math.round(v*100)/100;if(f==='target')logAct('Points to win changed to '+S[f])}S.fee=Math.round(S.rate*S.hours*100)/100;needsRender=true;stamp();cache();queuePush()}
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el||el.id!=='restoreFile'||!el.files||!el.files[0])return;
  const r=new FileReader();r.onload=()=>{restoreDraft=String(r.result||'');restoreOpen=true;armRestore=false;backupText='';render();toast('File loaded. Tap “Restore this backup” to replace what is in the app.')};r.onerror=()=>toast('That file could not be read.');r.readAsText(el.files[0]);
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el||!el.classList||!el.classList.contains('slot')||!canWrite)return;
  editLineup(Number(el.dataset.i),Number(el.dataset.n),el.dataset.t,Number(el.dataset.pos),Number(el.value));
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(needsRender&&!typing())render()},350));
document.addEventListener('input',e=>{
  const el=e.target;if(!el)return;
  if(el.id==='restoreText'){restoreDraft=el.value;return}
  if(el.classList&&el.classList.contains('miss')&&el.value)el.classList.remove('miss');
  const f=el.dataset&&el.dataset.f;
  if(S.phase!=='setup'||!canWrite||(f!=='start'&&f!=='end'&&f!=='rate'))return;
  if(f==='rate'){const v=parseFloat(String(el.value).replace(',','.'));S.rate=isFinite(v)&&v>=0?Math.round(v*100)/100:0}else S[f]=String(el.value).slice(0,40);
  syncHours(S);S.fee=Math.round(S.rate*S.hours*100)/100;liveMoney();
  needsRender=true;stamp();cache();queuePush();
});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.matches&&d.matches('details.grp')){groupsOpen=d.open;return}if(d&&d.matches&&d.matches('details.sched')){const i=Number(d.dataset.i);if(d.open)openSet.add(i);else openSet.delete(i)}},true);
setInterval(clock,1000);

render();
if(window.claude&&window.claude.use)connect();
else{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}}   // installed app: ask the browser to keep the data
})();
</script>

<script>
/* Offline support: the service worker keeps a copy of the app on the phone. */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
